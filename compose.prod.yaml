services:

  # Production Django sozlamalari
  web:
    image: ghcr.io/shahzodbek097/smartombor:latest
    build: !reset null
    pull_policy: always
    ports: !reset []

    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      DJANGO_HTTPS_ENABLED: "${DJANGO_HTTPS_ENABLED:-0}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-}"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/accounts/login/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  # Celery Worker
  celery_worker:
    image: ghcr.io/shahzodbek097/smartombor:latest
    build: !reset null
    pull_policy: always

    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      DJANGO_HTTPS_ENABLED: "${DJANGO_HTTPS_ENABLED:-0}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-}"


  # Celery Beat
  celery_beat:
    image: ghcr.io/shahzodbek097/smartombor:latest
    build: !reset null
    pull_policy: always

    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      DJANGO_HTTPS_ENABLED: "${DJANGO_HTTPS_ENABLED:-0}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-}"


  # Nginx reverse proxy
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro

    depends_on:
      web:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1/accounts/login/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
