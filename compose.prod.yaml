services:

  # Production Django sozlamalari
  web:
    ports: !reset []

    environment:
      DJANGO_DEBUG: "0"
      DJANGO_HTTPS_ENABLED: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,web"


  # Celery Worker
  celery_worker:
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_HTTPS_ENABLED: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,web"


  # Celery Beat
  celery_beat:
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_HTTPS_ENABLED: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,web"


  # Nginx reverse proxy
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro

    depends_on:
      web:
        condition: service_started
