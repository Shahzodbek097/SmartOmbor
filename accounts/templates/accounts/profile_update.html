{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Shaxsiy ma'lumotlarni tahrirlash</h4>
        </div>

        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">
                            {{ field.label }}
                        </label>

                        {{ field }}

                        {% if field.errors %}
                            <div class="text-danger small">
                                {{ field.errors }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn btn-success">
                    <i class="bi bi-save"></i>
                    Saqlash
                </button>

                <a href="{% url 'accounts:profile' %}"
                   class="btn btn-secondary">
                    Bekor qilish
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
