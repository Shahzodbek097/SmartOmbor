{% extends "base.html" %}
{% block title %}Parolni tiklash | SmartOmbor{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow border-0 mx-auto"
         style="max-width: 500px;">

        <div class="card-body p-4">

            <h3 class="fw-bold mb-3">Parolni tiklash</h3>

            <p class="text-muted">
                Email manzilingizni kiriting.
                Sizga parolni tiklash havolasini yuboramiz.
            </p>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">
                        Elektron pochta
                    </label>
                    {{ form.email }}
                    {{ form.email.errors }}
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Tiklash havolasini yuborish
                </button>
            </form>

        </div>
    </div>

</div>

{% endblock %}
