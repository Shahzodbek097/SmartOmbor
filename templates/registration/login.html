
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SmartOmbor - Kirish</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center"
     style="min-height: 100vh;">

    <div class="card shadow p-4 border-0" style="width: 400px;">

        <h3 class="text-center mb-2 fw-bold">SmartOmbor</h3>

        <p class="text-center text-muted mb-4">
            Ombor va savdo boshqaruv tizimi
        </p>

        <h5 class="text-center mb-4">Tizimga kirish</h5>

        {% if form.errors %}
            <div class="alert alert-danger">
                Login yoki parol noto'g'ri!
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <div class="mb-3">
                <label class="form-label">Foydalanuvchi nomi</label>
                <input type="text"
                       name="username"
                       class="form-control"
                       required
                       autofocus>
            </div>

            <div class="mb-3">
                <label class="form-label">Parol</label>
                <input type="password"
                       name="password"
                       class="form-control"
                       required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Kirish
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'accounts:password_reset' %}"
               class="text-decoration-none">
                Parolni unutdingizmi?
            </a>
        </div>

        <hr>

        <div class="text-center">
            <p class="mb-2">SmartOmbor'da hisobingiz yo'qmi?</p>

            <a href="{% url 'accounts:register' %}"
               class="btn btn-outline-primary w-100">
                Ro'yxatdan o'tish
            </a>
        </div>

    </div>
</div>

</body>
</html>
